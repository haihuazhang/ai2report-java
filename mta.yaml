_schema-version: 3.3.0
ID: aireport
version: 1.0.0-SNAPSHOT
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
modules:
  - name: aireport-srv
    type: java
    path: srv
    parameters:
      buildpack: java_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /actuator/health/readiness
    properties:
      SPRING_PROFILES_ACTIVE: cloud,sandbox
      # JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 21.+ } }'
      JAVA_OPTS: '-Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=8000'
    build-parameters:
      builder: custom
      commands:
        - mvn clean package -DskipTests=true --batch-mode
      build-result: target/*-exec.jar
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: aireport-db
      - name: aireport-auth
      - name: app-api
        properties:
          CDS_MULTITENANCY_APPUI_URL: ~{url}
      - name: aireport-destination

  - name: aireport-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
    requires:
      - name: aireport-db

  - name: aireport
    type: approuter.nodejs
    path: app\router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: aireport-auth
      - name: aireport-destination
      - name: aireport-html5-runtime
    provides:
      - name: app-api
        properties:
          url: ${default-url}
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: aireport-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: aireport-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: aireportchatbotui2
          artifacts:
            - chatbotui2.zip
          target-path: resources
        - name: aireportparameters
          artifacts:
            - parameters.zip
          target-path: resources
        - name: aireportreport
          artifacts:
            - report.zip
          target-path: resources
        - name: aireportcapragapp
          artifacts:
            - cap-rag-app.zip
          target-path: resources

  - name: aireportchatbotui2
    type: html5
    path: app/chatbotui2
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: aireportparameters
    type: html5
    path: app/parameters
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []
  - name: aireportreport
    type: html5
    path: app/report
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: aireport-destinations
    type: com.sap.application.content
    requires:
      - name: aireport-auth
        parameters:
          service-key:
            name: aireport-auth-key
      - name: aireport-html5-repo-host
        parameters:
          service-key:
            name: aireport-html5-repo-host-key
      - name: srv-api
      - name: aireport-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: aireport-html5-repository
              ServiceInstanceName: aireport-html5-repo-host
              ServiceKeyName: aireport-html5-repo-host-key
              sap.cloud.service: aireport.service
            - Name: aireport-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: aireport-auth
              ServiceKeyName: aireport-auth-key
              sap.cloud.service: aireport.service

  - name: aireportcapragapp
    type: html5
    path: app/cap-rag-app
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

resources:
  - name: aireport-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: aireport-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: aireport
        tenant-mode: dedicated
  - name: aireport-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: aireport-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
                HTML5.Timeout: 240000
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true

  - name: aireport-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: aireport-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
